name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 버전 표시 (서비스 워커가 새 버전을 받도록)
        run: |
          mkdir -p _site
          cp -r web/. _site/
          BUILD="${GITHUB_SHA::8}"
          sed -i "s/const BUILD = 'dev';/const BUILD = '${BUILD}';/" _site/sw.js
          sed -i "s/data-build=\"dev\"/data-build=\"${BUILD}\"/" _site/index.html
          grep -q "const BUILD = '${BUILD}'" _site/sw.js
          # 배포본에서는 로컬 개발용(에뮬레이터) 주소를 콘텐츠 보안 정책에서 뺀다.
          sed -i "s# http://127.0.0.1:9099 http://127.0.0.1:8080 http://localhost:8787##" _site/index.html
          ! grep -qE "127.0.0.1|localhost" _site/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
