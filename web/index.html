<!doctype html>
<html lang="ko" data-build="dev" data-font-scale="md">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--
    콘텐츠 보안 정책: 이 사이트, Firebase(gstatic/googleapis), Leaflet(cdnjs), 글꼴(Google Fonts, jsDelivr),
    지도 타일, Cloudflare Worker 외에는 아무것도 불러오지 않는다.
    Worker를 workers.dev 가 아닌 다른 주소로 쓰면 connect-src 에 그 주소를 추가한다.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https://tile.openstreetmap.org https://cdnjs.cloudflare.com https://www.google.com; connect-src 'self' https://*.googleapis.com https://www.gstatic.com https://*.workers.dev http://127.0.0.1:9099 http://127.0.0.1:8080; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>우리 가족 비상연락</title>
  <meta name="description" content="비상 상황에서 가족의 안전을 확인하고 다시 모이기 위한 가족 전용 서비스">
  <meta name="theme-color" content="#162e51">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="가족비상">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
        integrity="sha384-2nNKoOPayicGa+aRguOQuiZP+RqQ4G3jalfDeOgftkKD7zBM2gJXTwcFqCZltdv0" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
        integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
          integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">본문 바로가기</a>
  <header id="header" class="site-header">
    <div class="site-header-inner"><strong>우리 가족 비상연락</strong></div>
  </header>
  <nav id="topnav" class="top-nav" aria-label="주 메뉴"></nav>
  <div id="banner"></div>
  <main id="view" tabindex="-1">
    <div class="center-screen"><div class="spinner" aria-label="불러오는 중"></div></div>
  </main>
  <footer id="footer" class="site-footer"></footer>
  <nav id="nav" class="bottom-nav" aria-label="하단 메뉴"></nav>
  <noscript>
    <p class="empty">이 사이트는 자바스크립트가 필요합니다. 브라우저 설정에서 자바스크립트를 켜 주세요.</p>
  </noscript>
</body>
</html>
